<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>byshyma</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,sans-serif;background:#0a0a0f;color:#e0e0e0}.header{background:#12121a;border-bottom:1px solid #2a2a3a;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}.header h2{background:linear-gradient(135deg,#6C63FF,#FF6B9D);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:1.2rem}.lang-btn{background:transparent;border:1px solid #2a2a3a;color:#aaa;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:.8rem}.lang-btn.active{background:#6C63FF;color:#fff;border-color:#6C63FF}.hero{padding:80px 20px;text-align:center;background:radial-gradient(ellipse at top,#1a1a2e,#0a0a0f)}.hero h1{font-size:2.2rem;font-weight:800;background:linear-gradient(135deg,#fff,#a0a0c0);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.hero p{color:#888}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;padding:20px;max-width:1000px;margin:0 auto}.card{background:#12121a;border:1px solid #2a2a3a;border-radius:16px;padding:24px;text-align:center;cursor:pointer;transition:.3s}.card:hover{transform:translateY(-4px);border-color:#6C63FF}.card .icon{font-size:2.5rem;margin-bottom:10px}.card h3{color:#fff;font-size:1rem}.card p{color:#666;font-size:.8rem}.btn{background:linear-gradient(135deg,#6C63FF,#FF6B9D);color:#fff;border:none;padding:8px 18px;border-radius:20px;cursor:pointer;font-size:.8rem;display:inline-block;margin-top:10px}.back{background:transparent;border:1px solid #2a2a3a;color:#aaa;padding:8px 16px;border-radius:20px;cursor:pointer;margin:16px 20px 0;display:inline-block}.tool-page{max-width:900px;margin:0 auto;padding:20px}.box{background:#12121a;border:1px solid #2a2a3a;border-radius:12px;padding:20px;margin-bottom:16px}.box h3{color:#fff;font-size:1rem;margin-bottom:12px}.box input,.box select,.box textarea{width:100%;padding:10px;background:#1a1a2a;border:1px solid #2a2a3a;border-radius:8px;color:#e0e0e0;margin-bottom:12px;outline:none}.box input:focus{border-color:#6C63FF}.row{display:flex;gap:12px}.flex{display:flex;gap:8px;flex-wrap:wrap}.preview{background:#1a1a2a;border:2px dashed #2a2a3a;border-radius:12px;padding:16px;min-height:80px;margin-top:12px;font-size:.9rem}.toast{position:fixed;bottom:20px;right:20px;background:#6C63FF;color:#fff;padding:12px 24px;border-radius:12px;z-index:999}.mt-8{margin-top:8px}.hidden{display:none}footer{text-align:center;padding:30px;color:#444;border-top:1px solid #1a1a2a;margin-top:60px}.stat{text-align:center}.stat .num{font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,#6C63FF,#FF6B9D);-webkit-background-clip:text;-webkit-text-fill-color:transparent}@media(max-width:768px){.hero h1{font-size:1.5rem}.grid{grid-template-columns:1fr 1fr}.row{flex-direction:column}}@media(max-width:480px){.grid{grid-template-columns:1fr}}</style></head><body><div id="app"></div><script>const langData={tr:{brand:"byshyma",hero:"İhtiyacın Olan Tüm Dijital Araçlar Tek Yerde",sub:"7 güçlü araç — hepsi ücretsiz!",tools:[{i:"📄",t:"CV Oluşturucu",d:"CV oluşturun, PDF indirin"},{i:"💰",t:"Fatura Oluşturucu",d:"KDV'li fatura kesin"},{i:"📑",t:"PDF Araçları",d:"Birleştirin & sıkıştırın"},{i:"🤖",t:"AI Yazı Asistanı",d:"Yazı yazın, özet çıkarın"},{i:"📱",t:"WhatsApp Link",d:"Link & QR kod oluşturun"},{i:"🌐",t:"Web Sitesi",d:"Size site kuralım"},{i:"✨",t:"AI Prompt",d:"Video prompt'u yazın"}],ft:"© 2025 byshyma"},en:{brand:"byshyma",hero:"All Digital Tools You Need In One Place",sub:"7 powerful tools — all free!",tools:[{i:"📄",t:"CV Builder",d:"Create CV, download PDF"},{i:"💰",t:"Invoice Maker",d:"Create VAT invoices"},{i:"📑",t:"PDF Tools",d:"Merge & compress"},{i:"🤖",t:"AI Writing",d:"Write & edit text"},{i:"📱",t:"WhatsApp Link",d:"Generate link & QR"},{i:"🌐",t:"Website",d:"Let's build your site"},{i:"✨",t:"AI Prompt",d:"Write video prompts"}],ft:"© 2025 byshyma"}};let lang="tr";const L=s=>langData[lang][s]||s;function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)}function showHome(){document.getElementById("app").innerHTML=`<div class="header"><h2>🧰 ${L("brand")}</h2><div><button class="lang-btn${lang==="tr"?" active":""}" onclick="setL('tr')">🇹🇷</button><button class="lang-btn${lang==="en"?" active":""}" onclick="setL('en')">🇬🇧</button></div></div><div class="hero"><h1>${L("hero")}</h1><p>${L("sub")}</p><div style="margin-top:20px;display:flex;gap:12px;justify-content:center"><div class="stat"><div class="num">7</div><p style="color:#888;font-size:.8rem">${lang==="tr"?"Araç":"Tools"}</p></div><div class="stat"><div class="num">%100</div><p style="color:#888;font-size:.8rem">${lang==="tr"?"Ücretsiz":"Free"}</p></div></div></div><div class="grid" id="g"></div><footer>${L("ft")}</footer>`;document.getElementById("g").innerHTML=langData[lang].tools.map((t,i)=>`<div class="card" onclick="showTool(${i})"><div class="icon">${t.i}</div><h3>${t.t}</h3><p>${t.d}</p></div>`).join("")}function setL(l){lang=l;showHome()}function showTool(i){const names=["cv","fatura","pdf","ai","wa","web","prompt"];const icons=["📄","💰","📑","🤖","📱","🌐","✨"];const title=langData[lang].tools[i].t;const id=names[i];let content="";if(id==="cv")content='<div class="box"><h3>Kişisel Bilgiler</h3><input id="cName" placeholder="Ad Soyad"><div class="row"><input id="cMail" placeholder="E-posta"><input id="cTel" placeholder="Telefon"></div></div><div class="box"><h3>Eğitim</h3><div id="eList"></div><button class="btn" onclick="addE()" style="margin-top:8px">+ Ekle</button></div><div class="box"><h3>Deneyim</h3><div id="xList"></div><button class="btn" onclick="addX()" style="margin-top:8px">+ Ekle</button></div><div class="box"><h3>Yetenekler</h3><div id="sTags" class="flex"></div><input id="sIn" placeholder="Yetenek yaz + Enter"></div><button class="btn" onclick="prevCV()">👁 Önizle</button><div id="cPreview" class="preview">Formu doldurun</div>';else if(id==="fatura")content='<div class="box"><h3>Fatura</h3><div class="row"><input id="fNo" value="FT-1"><input id="fTar" type="date"></div></div><div class="box"><h3>Satıcı</h3><div class="row"><input id="fsAd" placeholder="Ad"><input id="fsAdres" placeholder="Adres"></div></div><div class="box"><h3>Alıcı</h3><div class="row"><input id="faAd" placeholder="Ad"><input id="faAdres" placeholder="Adres"></div></div><div class="box"><h3>Kalemler</h3><div id="fBody"></div><button class="btn" onclick="addF()" style="margin-top:8px">+ Kalem</button><div style="text-align:right;margin-top:12px"><strong>Toplam: <span id="fTotal">0</span> TL</strong></div></div>';else if(id==="pdf")content='<div class="box"><h3>PDF Araçları</h3><p style="color:#666">Yakında aktif olacak.</p></div>';else if(id==="ai")content='<div class="box"><h3>Metin Girin</h3><textarea id="aIn" rows="5" placeholder="Metninizi yazın..."></textarea><div class="flex"><button class="btn" onclick="aAct(\'r\')">🔄 Yeniden Yaz</button><button class="btn" onclick="aAct(\'s\')">📋 Özet</button><button class="btn" onclick="aAct(\'c\')">➡️ Devam</button></div></div><div class="box"><h3>Çıktı</h3><div id="aOut" class="preview">Çıktı burada</div></div>';else if(id==="wa")content='<div class="box"><h3>WhatsApp Link</h3><input id="wTel" value="+90" style="font-size:1.1rem"><textarea id="wMsg" rows="2" placeholder="Mesaj (opsiyonel)"></textarea><button class="btn" onclick="genW()">🔗 Oluştur</button><div id="wRes" style="display:none;margin-top:12px"><input id="wLink" readonly style="background:#1a1a2a;border:1px solid #2a2a3a;padding:10px;border-radius:8px;color:#e0e0e0;width:100%"></div></div>';else if(id==="web")content='<div class="box"><h3>Web Sitesi Teklifi</h3><input id="wbAd" placeholder="İşletme Adı"><div class="row"><input id="wbTel" placeholder="Telefon"><input id="wbMail" placeholder="E-posta"></div><textarea id="wbNot" rows="3" placeholder="Ne istediğinizi yazın..."></textarea><button class="btn" onclick="gonder()">📩 Gönder</button><div id="wbSon" style="display:none;margin-top:12px;padding:12px;background:#6C63FF33;border-radius:8px;text-align:center">✅ Talebiniz alındı!</div></div>';else if(id==="prompt")content='<div class="box"><h3>Prompt Oluştur</h3><textarea id="pIn" rows="3" placeholder="Fikrinizi yazın..."></textarea><div class="row"><select id="pPlat" style="background:#1a1a2a;border:1px solid #2a2a3a;padding:10px;border-radius:8px;color:#e0e0e0"><option>🎬 CapCut</option><option>🎨 Midjourney</option><option>💬 ChatGPT</option></select><select id="pDur" style="background:#1a1a2a;border:1px solid #2a2a3a;padding:10px;border-radius:8px;color:#e0e0e0"><option>15s</option><option selected>60s</option><option>180s</option></select></div><button class="btn" onclick="genP()">✨ Oluştur</button><div id="pSon" class="preview hidden"></div></div>';document.getElementById("app").innerHTML=`<div class="header"><h2>🧰 ${L("brand")}</h2><div><button class="lang-btn${lang==="tr"?" active":""}" onclick="setL2(\`${id}\`)">🇹🇷</button><button class="lang-btn${lang==="en"?" active":""}" onclick="setL2(\`${id}\`)">🇬🇧</button></div></div><div class="tool-page"><button class="back" onclick="showHome()">← ${lang==="tr"?"Ana Sayfa":"Home"}</button><h2 style="margin:16px 0">${icons[i]} ${title}</h2>${content}</div><footer>${L("ft")}</footer>`}function setL2(id){lang=lang==="tr"?"en":"tr";showTool(["cv","fatura","pdf","ai","wa","web","prompt"].indexOf(id))}let skills=[];function addE(){const d=document.getElementById("eList");const i=document.createElement("div");i.style.cssText="padding:8px;border:1px solid #2a2a3a;border-radius:8px;margin-bottom:8px";i.innerHTML='<div class="row"><input class="eOk" placeholder="Okul"><input class="eBol" placeholder="Bölüm"><input class="eYil" placeholder="Yıl"></div><button class="btn btn-sm" style="margin-top:4px;background:#FF6B9D33;color:#FF6B9D" onclick="this.parentElement.remove()">Sil</button>';d.appendChild(i)}function addX(){const d=document.getElementById("xList");const i=document.createElement("div");i.style.cssText="padding:8px;border:1px solid #2a2a3a;border-radius:8px;margin-bottom:8px";i.innerHTML='<div class="row"><input class="xSir" placeholder="Şirket"><input class="xPoz" placeholder="Pozisyon"><input class="xYil" placeholder="Yıl"></div><textarea class="xAc" rows="2" placeholder="Açıklama" style="margin-top:4px"></textarea><button class="btn btn-sm" style="margin-top:4px;background:#FF6B9D33;color:#FF6B9D" onclick="this.parentElement.remove()">Sil</button>';d.appendChild(i)}document.addEventListener("keydown",e=>{if(e.target?.id==="sIn"&&e.key==="Enter"){const v=e.target.value.trim();if(v){skills.push(v);e.target.value="";const c=document.getElementById("sTags");if(c)c.innerHTML=skills.map((s,i)=>`<span class="tag" style="background:#2a2a3a;padding:4px 12px;border-radius:20px;font-size:.8rem">${s} <span style="cursor:pointer;color:#FF6B9D" onclick="skills.splice(${i},1);document.getElementById('sTags').innerHTML=skills.map((ss,ii)=>'<span style=\"background:#2a2a3a;padding:4px 12px;border-radius:20px;font-size:.8rem\">'+ss+' <span style=\"cursor:pointer;color:#FF6B9D\" onclick=\"skills.splice('+ii+',1);this.parentElement.parentElement.remove()\">×</span></span>').join('')">×</span></span>`).join("")}}});function prevCV(){const n=document.getElementById("cName")?.value||"Ad";const p=document.getElementById("cPreview");if(p)p.innerHTML=`<h3>${n}</h3><p style="color:#888">Önizleme hazır</p>`;toast("Önizleme!")}function addF(){const b=document.getElementById("fBody");const r=document.createElement("div");r.style.cssText="display:flex;gap:8px;margin-bottom:8px;align-items:center";r.innerHTML='<input placeholder="Ürün" style="flex:1;padding:8px;background:#1a1a2a;border:1px solid #2a2a3a;border-radius:4px;color:#e0e0e0"><input type="number" value="1" style="width:60px;padding:8px;background:#1a1a2a;border:1px solid #2a2a3a;border-radius:4px;color:#e0e0e0"><input type="number" value="0" style="width:80px;padding:8px;background:#1a1a2a;border:1px solid #2a2a3a;border-radius:4px;color:#e0e0e0"><span style="font-weight:600;width:60px">0</span><button style="background:transparent;border:none;color:#FF6B9D;cursor:pointer" onclick="this.parentElement.remove();calcF()">×</button>';b.appendChild(r)}function calcF(){let t=0;document.querySelectorAll("#fBody>div").forEach(d=>{const q=parseFloat(d.querySelector("input[type=number]")?.value)||0;const p=parseFloat(d.querySelector("input[type=number]:last-of-type")?.value)||0;const s=q*p;const sp=d.querySelector("span");if(sp)sp.textContent=s.toFixed(2);t+=s});const el=document.getElementById("fTotal");if(el)el.textContent=t.toFixed(2)}function aAct(t){const v=document.getElementById("aIn")?.value;if(!v){toast("Metin girin!");return}const o=document.getElementById("aOut");if(o)o.textContent=t==="r"?`Yeniden: ${v}`:t==="s"?`Özet: ${v.slice(0,50)}...`:t==="c"?`${v}\n\nDevam ediyor...`:`${v}`;toast("Tamam!")}function genW(){const t=document.getElementById("wTel")?.value.replace(/[^0-9+]/g,"")||"+90";const m=document.getElementById("wMsg")?.value.trim()||"";let u=`https://wa.me/${t}`;if(m)u+="?text="+encodeURIComponent(m);const r=document.getElementById("wRes");r.style.display="block";document.getElementById("wLink").value=u;toast("Link oluşturuldu!")}function gonder(){document.getElementById("wbSon").style.display="block";toast("Gönderildi!")}function genP(){const v=document.getElementById("pIn")?.value.trim();if(!v){toast("Fikir yazın!");return}const plat=document.getElementById("pPlat")?.value||"";const dur=document.getElementById("pDur")?.value||"60";const son=document.getElementById("pSon");son.classList.remove("hidden");son.textContent=`${plat} için "${v}" hakkında ${dur} saniyelik video prompt'u hazır.`;toast("Prompt hazır!")}showHome();</script></body></html>
