<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>byshyma</title><style>*{margin:0;padding:0;box-sizing:border-box}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><style>body{font-family:'Inter',sans-serif;background:#0a0a0f;color:#e0e0e0;min-height:100vh}.header{background:#12121a;border-bottom:1px solid #2a2a3a;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}.header h2{font-size:1.2rem;font-weight:800;background:linear-gradient(135deg,#6C63FF,#FF6B9D);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.lang-btn{background:transparent;border:1px solid #2a2a3a;color:#aaa;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:.8rem;font-weight:600;transition:.2s}.lang-btn.active{background:#6C63FF;color:#fff;border-color:#6C63FF}.lang-btn:hover{background:#2a2a3a}.hero{padding:100px 20px 80px;text-align:center;background:radial-gradient(ellipse at top,#1a1a2e,#0a0a0f)}.hero h1{font-size:2.5rem;font-weight:800;margin-bottom:16px;background:linear-gradient(135deg,#fff,#a0a0c0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.2}.hero p{color:#888;font-size:1.1rem;max-width:500px;margin:0 auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;padding:20px;max-width:1000px;margin:0 auto}.card{background:#12121a;border:1px solid #2a2a3a;border-radius:16px;padding:24px;text-align:center;cursor:pointer;transition:.3s}.card:hover{transform:translateY(-4px);border-color:#6C63FF;box-shadow:0 8px 30px rgba(108,99,255,.15)}.card .icon{font-size:2.5rem;margin-bottom:12px}.card h3{font-size:1rem;font-weight:600;margin-bottom:6px;color:#fff}.card p{color:#666;font-size:.8rem;line-height:1.4}.btn-hero{display:inline-block;margin-top:30px;padding:14px 32px;background:linear-gradient(135deg,#6C63FF,#FF6B9D);color:#fff;border:none;border-radius:30px;font-size:1rem;font-weight:600;cursor:pointer;transition:.3s;text-decoration:none}.btn-hero:hover{transform:scale(1.05);box-shadow:0 8px 30px rgba(108,99,255,.3)}footer{text-align:center;padding:40px 20px;color:#444;font-size:.85rem;border-top:1px solid #1a1a2a;margin-top:60px}.features{max-width:1000px;margin:0 auto;padding:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;text-align:center;margin-top:-30px;position:relative;z-index:10}.feature-box{background:#12121a;border:1px solid #2a2a3a;border-radius:12px;padding:16px}.feature-box .num{font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,#6C63FF,#FF6B9D);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.feature-box p{color:#666;font-size:.8rem;margin-top:4px}@media(max-width:768px){.hero h1{font-size:1.6rem}.features{grid-template-columns:1fr;margin-top:0}.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}}</style></head><body><div id="app"></div><script>const d={tr:{brand:"byshyma",hero:"İhtiyacın Olan Tüm Dijital Araçlar Tek Yerde",sub:"7 güçlü araç — CV'den prompt'a, hepsi ücretsiz!",btn:"Hemen Başla",tools:[{i:"📄",t:"CV Oluşturucu",d:"Profesyonel CV oluşturun"},{i:"💰",t:"Fatura Oluşturucu",d:"KDV'li fatura kesin"},{i:"📑",t:"PDF Araçları",d:"Birleştirin & sıkıştırın"},{i:"🤖",t:"AI Yazı Asistanı",d:"Metin yazın & düzenleyin"},{i:"📱",t:"WhatsApp Link",d:"Link & QR kod oluşturun"},{i:"🌐",t:"Web Sitesi",d:"Size site kuralım"},{i:"✨",t:"AI Prompt",d:"Video prompt'u yazın"}],ft:"© 2025 byshyma"},en:{brand:"byshyma",hero:"All Digital Tools You Need In One Place",sub:"7 powerful tools — from CV to prompt, all free!",btn:"Get Started",tools:[{i:"📄",t:"CV Builder",d:"Create professional CV"},{i:"💰",t:"Invoice Maker",d:"Create VAT invoices"},{i:"📑",t:"PDF Tools",d:"Merge & compress"},{i:"🤖",t:"AI Writing",d:"Write & edit text"},{i:"📱",t:"WhatsApp Link",d:"Generate link & QR"},{i:"🌐",t:"Website",d:"Let's build your site"},{i:"✨",t:"AI Prompt",d:"Write video prompts"}],ft:"© 2025 byshyma"}};let lang="tr";function render(){const t=d[lang];document.getElementById("app").innerHTML='<div class="header"><h2>'+t.brand+'</h2><div><button class="lang-btn'+(lang==="tr"?" active":"")+'" onclick="setLang(\'tr\')">🇹🇷 TR</button><button class="lang-btn'+(lang==="en"?" active":"")+'" onclick="setLang(\'en\')">🇬🇧 EN</button></div></div><div class="hero"><h1>'+t.hero+'</h1><p>'+t.sub+'</p><button class="btn-hero" onclick="document.getElementById(\'tools\').scrollIntoView({behavior:\'smooth\'})">'+t.btn+' →</button></div><div class="features"><div class="feature-box"><div class="num">7</div><p>'+(lang==="tr"?"Farklı Araç":"Different Tools")+'</p></div><div class="feature-box"><div class="num">%100</div><p>'+(lang==="tr"?"Ücretsiz":"Free")+'</p></div><div class="feature-box"><div class="num">2</div><p>'+(lang==="tr"?"Dil Seçeneği":"Languages")+'</p></div></div><div class="grid" id="g"></div><footer>'+t.ft+'</footer>';document.getElementById("g").innerHTML=t.tools.map(a=>'<div class="card"><div class="icon">'+a.i+'</div><h3>'+a.t+'</h3><p>'+a.d+'</p></div>').join("")}function setLang(l){lang=l;render()}render();</script></body></html>
