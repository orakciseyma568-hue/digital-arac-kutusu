<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>byshyma - Dijital Araç Kutusu</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--primary:#4A90D9;--accent:#FF6B6B}body{font-family:-apple-system,sans-serif;background:#f8f9fa;color:#2C3E50}.header{background:#fff;padding:20px;text-align:center;font-size:1.5rem;font-weight:bold;border-bottom:1px solid #eee}.header span{color:var(--primary)}.hero{background:linear-gradient(135deg,#4A90D9,#357ABD);color:#fff;text-align:center;padding:60px 20px}.hero h1{font-size:2rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;padding:40px 20px;max-width:1100px;margin:0 auto}.card{background:#fff;border-radius:16px;padding:24px;text-align:center;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.06)}.card:hover{transform:translateY(-4px)}.card .icon{font-size:3rem;margin-bottom:12px}.card h3{font-size:1.2rem}.card p{color:#6C757D;font-size:.9rem;margin-bottom:12px}.btn{background:var(--primary);color:#fff;border:none;padding:10px 24px;border-radius:8px;cursor:pointer;display:inline-block}footer{background:#2C3E50;color:rgba(255,255,255,.7);text-align:center;padding:24px;margin-top:40px}</style></head><body><header class="header">🧰 Dijital <span>Araç Kutusu</span></header><div class="hero"><h1>İhtiyacın Olan Tüm Dijital Araçlar Tek Yerde</h1><p>CV, fatura, PDF, AI asistan, WhatsApp, prompt</p></div><div class="grid" id="grid"></div><footer>🧰 byshyma</footer><script>const t=[{icon:"📄",title:"CV Oluşturucu"},{icon:"💰",title:"Fatura Oluşturucu"},{icon:"📑",title:"PDF Araçları"},{icon:"🤖",title:"AI Yazı Asistanı"},{icon:"📱",title:"WhatsApp Link"},{icon:"🌐",title:"Web Sitesi Hizmeti"},{icon:"✨",title:"AI Prompt Mühendisi"}];document.getElementById("grid").innerHTML=t.map(a=>'<div class="card"><div class="icon">'+a.icon+'</div><h3>'+a.title+'</h3><span class="btn">Kullan →</span></div>').join('');</script></body></html>
